# Local stack:  docker compose up --build
# db = Postgres (localhost:5433), api = FastAPI (http://localhost:8010), worker = job runner with Stockfish. The frontend runs with `npm run dev`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chesslab
      POSTGRES_PASSWORD: chesslab
      POSTGRES_DB: chesslab
    ports:
      - "5433:5432"   # host port 5433, because 5432 is often taken by another Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chesslab -d chesslab"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./services/backend
    environment:
      DATABASE_URL: postgresql+psycopg://chesslab:chesslab@db:5432/chesslab
      ALLOWED_ORIGINS: http://localhost:5180
    ports:
      - "8010:8000"   # http://localhost:8010 on your machine
    depends_on:
      db:
        condition: service_healthy
    # Migrations run once here, before the API starts. The worker waits for the API to be healthy.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: ./services/backend
    environment:
      DATABASE_URL: postgresql+psycopg://chesslab:chesslab@db:5432/chesslab
    depends_on:
      api:
        condition: service_healthy
    command: python -m app.worker
    stop_grace_period: 30s  # time to finish the current job after SIGTERM

volumes:
  pgdata:
