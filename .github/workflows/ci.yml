name: CI
on:
  pull_request:
  push:
    branches: [main, srikanth_dev, dev_shiva]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: chesslab, POSTGRES_PASSWORD: chesslab, POSTGRES_DB: chesslab }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chesslab" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: services/backend
    env:
      DATABASE_URL: postgresql+psycopg://chesslab:chesslab@localhost:5432/chesslab
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run alembic upgrade head          # proves migrations apply to an empty database
      - run: uv run alembic check                # proves models and migrations agree
      - run: uv run pytest -q                     # tests create/drop their own chesslab_test database
      - run: docker build -t chesslab-backend .   # the image Render will build must build here too

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/play.spec.ts   # frontend-only journeys; full-stack e2e runs locally